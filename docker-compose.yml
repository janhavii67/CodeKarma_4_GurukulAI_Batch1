services:
  db:
    image: postgres:16-alpine
    container_name: gurukul_postgres
    environment:
      POSTGRES_USER: gurukul
      POSTGRES_PASSWORD: gurukul_dev_secret
      POSTGRES_DB: gurukul_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gurukul -d gurukul_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gurukul_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://gurukul:gurukul_dev_secret@db:5432/gurukul_ai
      SESSION_SECRET: dev_session_secret_change_me_in_production_998877665544332211
      COOKIE_SECURE: "false"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      MEDIA_DIR: "/data/media"
    volumes:
      - ./backend:/app
      - media_volume:/data/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gurukul_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  media_volume:
